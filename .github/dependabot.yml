version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      # Do not propose a version published in the last week. A compromised
      # release is usually yanked well inside that window.
      default-days: 7
    # PR titles become the squash-merge subject, which release-please parses as
    # a conventional commit. A dependency bump ships in the binary, so it is a
    # patch-worthy "fix"; see .github/workflows/pr-title.yml for the allowed types.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      go-dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directories:
      # "/" only scans .github/workflows; composite actions need their own entries.
      - "/"
      - "/.github/actions/setup"
      - "/.github/actions/harbor-login"
    schedule:
      interval: weekly
    cooldown:
      # Do not propose a version published in the last week. A compromised
      # release is usually yanked well inside that window.
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      # Do not propose a version published in the last week. A compromised
      # release is usually yanked well inside that window.
      default-days: 7
    commit-message:
      prefix: build
      include: scope
