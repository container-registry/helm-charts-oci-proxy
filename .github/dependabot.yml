version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directories:
      # "/" only scans .github/workflows; composite actions need their own entries.
      - "/"
      - "/.github/actions/setup"
      - "/.github/actions/harbor-login"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
