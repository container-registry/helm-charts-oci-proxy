name: Publish Chart

on:
  workflow_call:
    inputs:
      chart_version:
        description: Chart version to publish (must match chart/Chart.yaml at tag chart-v<version>)
        type: string
        required: true
      registry_address:
        description: OCI registry address
        type: string
        default: '8gears.container-registry.com'
      registry_project:
        description: Registry project (namespace) for the chart
        type: string
        default: 'library'

permissions: {}

concurrency:
  group: publish-chart-${{ inputs.chart_version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY_ADDRESS: ${{ inputs.registry_address }}
      REGISTRY_PROJECT: ${{ inputs.registry_project }}
      CHART_VERSION: ${{ inputs.chart_version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chart-v${{ inputs.chart_version }}
          persist-credentials: false

      - name: Assert chart version matches tag
        run: |
          set -euo pipefail
          # yq (mikefarah v4) is preinstalled on ubuntu-latest runners.
          actual=$(yq -r '.version' chart/Chart.yaml)
          if [ "${actual}" != "${CHART_VERSION}" ]; then
            echo "chart/Chart.yaml version '${actual}' does not match requested chart_version '${CHART_VERSION}'" >&2
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to registry via OIDC
        run: |
          set -euo pipefail
          response=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://${REGISTRY_ADDRESS}")
          token=$(jq -r '.value' <<<"${response}")
          echo "::add-mask::${token}"
          # Username is ignored; Harbor maps the JWT to a federated robot via claim rules.
          helm registry login "${REGISTRY_ADDRESS}" --username jwt --password-stdin <<< "${token}"
          oras login "${REGISTRY_ADDRESS}" --username jwt --password-stdin <<< "${token}"

      - name: Assert appVersion image exists
        # The chart's default image ref is <repository>:<appVersion>. Enforces the
        # "merge the appVersion PR before the chart release PR" rule from
        # docs/RELEASES.md instead of trusting it.
        run: |
          set -euo pipefail
          app_version=$(yq -r '.appVersion' chart/Chart.yaml)
          if ! oras manifest fetch "${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/helm-charts-oci-proxy:${app_version}" > /dev/null; then
            echo "Image tag '${app_version}' (chart appVersion) not found in ${REGISTRY_PROJECT} — merge the appVersion update PR first" >&2
            exit 1
          fi

      - name: Package chart
        run: task chart:package

      - name: Push chart
        run: helm push "dist/helm-charts-oci-proxy-${CHART_VERSION}.tgz" "oci://${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}"

      - name: Push Artifact Hub repository metadata
        run: |
          oras push "${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/helm-charts-oci-proxy:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Smoke test published chart
        run: |
          set -euo pipefail
          helm pull "oci://${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/helm-charts-oci-proxy" --version "${CHART_VERSION}" -d /tmp/smoke
          helm template "/tmp/smoke/helm-charts-oci-proxy-${CHART_VERSION}.tgz"
