name: Publish Chart

on:
  workflow_call:
    inputs:
      chart_version:
        description: Chart version to publish (must match chart/Chart.yaml at tag chart-v<version>)
        type: string
        required: true
      registry_address:
        description: OCI registry address
        type: string
        default: '8gears.container-registry.com'
      registry_project:
        description: Registry project (namespace) for the chart
        type: string
        default: 'library'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY_ADDRESS: ${{ inputs.registry_address }}
      REGISTRY_PROJECT: ${{ inputs.registry_project }}
      CHART_VERSION: ${{ inputs.chart_version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chart-v${{ inputs.chart_version }}
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup
        with:
          helm: 'true'
          oras: 'true'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to registry via OIDC
        uses: ./.github/actions/harbor-login
        with:
          registry_address: ${{ inputs.registry_address }}
          # docker included so ~/.docker/config.json carries the credentials cosign reads.
          clients: docker helm oras

      - name: Publish, sign, and smoke test chart
        # All logic lives in taskfiles/chart.yml so it can be run and tested
        # locally (see chart:release and the PLAIN_HTTP/COSIGN_SIGN_FLAGS vars);
        # this workflow only provides checkout, tools, and registry auth.
        run: |
          task chart:release \
            CHART_VERSION="${CHART_VERSION}" \
            REGISTRY_ADDRESS="${REGISTRY_ADDRESS}" \
            REGISTRY_PROJECT="${REGISTRY_PROJECT}"
