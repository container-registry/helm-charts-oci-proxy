name: Publish Chart

on:
  workflow_call:
    inputs:
      chart_version:
        description: Chart version to publish (must match chart/Chart.yaml at tag chart-v<version>)
        type: string
        required: true
      registry_address:
        description: OCI registry address
        type: string
        default: '8gears.container-registry.com'
      registry_project:
        description: Registry project (namespace) for the chart
        type: string
        default: 'library'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY_ADDRESS: ${{ inputs.registry_address }}
      REGISTRY_PROJECT: ${{ inputs.registry_project }}
      CHART_VERSION: ${{ inputs.chart_version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chart-v${{ inputs.chart_version }}
          persist-credentials: false

      - name: Assert chart version matches tag
        run: |
          set -euo pipefail
          # yq (mikefarah v4) is preinstalled on ubuntu-latest runners.
          actual=$(yq -r '.version' chart/Chart.yaml)
          if [ "${actual}" != "${CHART_VERSION}" ]; then
            echo "chart/Chart.yaml version '${actual}' does not match requested chart_version '${CHART_VERSION}'" >&2
            exit 1
          fi

      - name: Set up tools
        uses: ./.github/actions/setup
        with:
          helm: 'true'
          oras: 'true'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to registry via OIDC
        uses: ./.github/actions/harbor-login
        with:
          registry_address: ${{ inputs.registry_address }}
          # docker included so ~/.docker/config.json carries the credentials cosign reads.
          clients: docker helm oras

      - name: Assert appVersion image exists
        # The chart's default image ref is <repository>:<appVersion>. Enforces the
        # "merge the appVersion PR before the chart release PR" rule from
        # docs/RELEASES.md instead of trusting it.
        run: |
          set -euo pipefail
          app_version=$(yq -r '.appVersion' chart/Chart.yaml)
          if ! oras manifest fetch "${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/helm-charts-oci-proxy:${app_version}" > /dev/null; then
            echo "Image tag '${app_version}' (chart appVersion) not found in ${REGISTRY_PROJECT} — merge the appVersion update PR first" >&2
            exit 1
          fi

      - name: Check for already-published chart version
        id: published
        # Re-pushing a served chart version changes its digest and Artifact Hub
        # cannot re-index it (docs/RELEASES.md invariant). Only a confirmed 404
        # may take the push path: a transient fetch error must fail the job, not
        # masquerade as "not published".
        run: |
          set -euo pipefail
          ref="${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/helm-charts-oci-proxy:${CHART_VERSION}"
          set +e
          descriptor=$(oras manifest fetch --descriptor "${ref}" 2>"${RUNNER_TEMP}/fetch-err")
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            digest=$(jq -r '.digest' <<<"${descriptor}")
            echo "Chart version ${CHART_VERSION} already published (${digest}) — skipping push, repairing signature/metadata if needed."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|MANIFEST_UNKNOWN|NAME_UNKNOWN|404' "${RUNNER_TEMP}/fetch-err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            command cat "${RUNNER_TEMP}/fetch-err" >&2
            echo "Could not determine whether ${ref} exists — refusing to push blindly" >&2
            exit 1
          fi

      - name: Package chart
        if: steps.published.outputs.exists == 'false'
        run: task chart:package

      - name: Push chart
        if: steps.published.outputs.exists == 'false'
        id: push
        run: |
          set -euo pipefail
          output=$(helm push "dist/helm-charts-oci-proxy-${CHART_VERSION}.tgz" "oci://${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}" 2>&1)
          printf '%s\n' "${output}"
          digest=$(sed -n 's/^Digest: //p' <<<"${output}")
          if ! grep -Eq '^sha256:[0-9a-f]{64}$' <<<"${digest}"; then
            echo "Could not parse chart digest from helm push output" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart
        # Runs on re-runs too: a previous run may have pushed the chart and died
        # before signing. Skips only when the signature already exists.
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.published.outputs.digest }}
        run: |
          set -euo pipefail
          sig_ref="${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/helm-charts-oci-proxy:sha256-${DIGEST#sha256:}.sig"
          set +e
          oras manifest fetch --descriptor "${sig_ref}" > /dev/null 2>"${RUNNER_TEMP}/sig-err"
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            echo "Signature for ${DIGEST} already present, skipping."
          elif grep -qiE 'not found|MANIFEST_UNKNOWN|NAME_UNKNOWN|404' "${RUNNER_TEMP}/sig-err"; then
            cosign sign --yes "${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/helm-charts-oci-proxy@${DIGEST}"
          else
            command cat "${RUNNER_TEMP}/sig-err" >&2
            echo "Could not determine whether ${sig_ref} exists" >&2
            exit 1
          fi

      - name: Push Artifact Hub repository metadata
        # Unconditional: content-addressed, so re-pushing identical metadata is a
        # no-op, and re-runs repair a metadata push that previously failed.
        run: |
          oras push "${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/helm-charts-oci-proxy:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Smoke test published chart
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/smoke"
          helm pull "oci://${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/helm-charts-oci-proxy" --version "${CHART_VERSION}" -d "${RUNNER_TEMP}/smoke"
          helm template "${RUNNER_TEMP}/smoke/helm-charts-oci-proxy-${CHART_VERSION}.tgz"
