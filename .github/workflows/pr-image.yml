name: PR Image

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - 'taskfiles/app.yml'
      - 'Taskfile.yml'
      - '.github/workflows/pr-image.yml'
      - '.github/workflows/publish-image.yml'
      - '.github/actions/**'

permissions: {}

concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-image.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      image_tag: pr-${{ github.event.pull_request.number }}
      registry_address: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      registry_project: ${{ vars.PR_REGISTRY_PROJECT || 'library-dev' }}

  pr-comment:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      IMAGE: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}/${{ vars.PR_REGISTRY_PROJECT || 'library-dev' }}/helm-charts-oci-proxy
      IMAGE_TAG: pr-${{ github.event.pull_request.number }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Create or update preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- helm-charts-oci-proxy-pr-preview -->';
            const image = process.env.IMAGE;
            const tag = process.env.IMAGE_TAG;
            const digest = process.env.DIGEST;
            const body = [
              marker,
              '### PR preview image',
              '',
              `**Image:** \`${image}:${tag}\``,
              '',
              `**Digest:** \`${digest}\``,
              '',
              '```sh',
              `docker pull ${image}:${tag}`,
              `docker pull ${image}@${digest}`,
              '```',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
