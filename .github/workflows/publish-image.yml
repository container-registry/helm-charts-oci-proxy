name: Publish Image

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to build from
        required: true
        type: string
      image_tag:
        description: Primary image tag
        required: true
        type: string
      extra_tag:
        description: Optional additional image tag; a literal '{shortsha}' is replaced with the 7-char SHA of the built commit
        required: false
        type: string
        default: ''
      version:
        description: Version to embed; derived via git describe when empty
        required: false
        type: string
        default: ''
      registry_address:
        description: Registry host
        required: false
        type: string
        default: 8gears.container-registry.com
      registry_project:
        description: Registry project
        required: false
        type: string
        default: library
    outputs:
      digest:
        description: Digest of the pushed multi-arch image
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      IMAGE: ${{ inputs.registry_address }}/${{ inputs.registry_project }}/helm-charts-oci-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION_INPUT}" ]; then
            version="${VERSION_INPUT}"
          else
            version=$(git describe --tags --always)
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to registry via OIDC
        uses: ./.github/actions/harbor-login
        with:
          registry_address: ${{ inputs.registry_address }}
      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          set -euo pipefail
          tags=(-t "${IMAGE}:${IMAGE_TAG}")
          if [ -n "${EXTRA_TAG}" ]; then
            # {shortsha} is expanded here because caller expressions cannot slice strings.
            sha=$(git rev-parse HEAD)
            tags+=(-t "${IMAGE}:${EXTRA_TAG//\{shortsha\}/${sha:0:7}}")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --provenance=false \
            --sbom=false \
            --build-arg VERSION="${VERSION}" \
            --metadata-file /tmp/build-metadata.json \
            "${tags[@]}" \
            .
      - name: Capture digest
        id: digest
        # From the build metadata, not a tag re-read: a concurrent push to the
        # same tag must not change which digest gets signed/reported.
        run: |
          set -euo pipefail
          digest=$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)
          if ! grep -Eq '^sha256:[0-9a-f]{64}$' <<<"${digest}"; then
            echo "Invalid digest: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ inputs.registry_address }}/${{ inputs.registry_project }}/helm-charts-oci-proxy
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      # Checkout only so the repo-local harbor-login action is available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Log in to registry via OIDC
        uses: ./.github/actions/harbor-login
        with:
          registry_address: ${{ inputs.registry_address }}
      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Generate SBOM
        run: syft "registry:${IMAGE}@${DIGEST}" -o spdx-json > sbom.spdx.json
      - name: Attest SBOM
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
