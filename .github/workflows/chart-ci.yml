name: Chart CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'taskfiles/chart.yml'
      - '.github/workflows/chart-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'taskfiles/chart.yml'
      - '.github/workflows/chart-ci.yml'

permissions: {}

concurrency:
  group: chart-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2

      - name: Lint chart
        run: task chart:lint

      - name: Render templates
        run: task chart:template

      - name: Run unit tests
        run: task chart:unittest
