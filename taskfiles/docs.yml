version: '3'

# Diagrams are authored as SVGBob ASCII art inside an HTML comment and rendered
# through Kroki, so the Markdown source stays the single source of truth and
# no binary is checked in:
#
#   <!--
#   ```SVGBob
#   <ascii diagram>
#   ```
#   -->
#   ![alt](https://kroki.io/svgbob/svg/<encoded>)   <- generated by `task docs:svgbob`
#
# '-->' handling: ASCII arrows such as '+----->' contain '-->', which would close
# the surrounding HTML comment early on GitHub and leak the diagram. The task
# rewrites every '-->' in the diagram body to '-–>' (hyphen, EN DASH U+2013, '>').
# SVGBob renders both identically, so author with plain '-->' and let the task
# escape it. A missing image link is added automatically.

tasks:
  default:
    desc: Generate all docs (SVGBob diagrams)
    cmds:
      - task: svgbob

  svgbob:
    desc: Update Kroki SVGBob diagram URLs in all tracked Markdown files
    aliases: [kroki]
    silent: true
    cmd: |
      python3 - <<'PYTHON'
      import re, zlib, base64, subprocess

      DASH = '-–>'   # hyphen + EN DASH + '>': renders like '-->' but does not close the comment

      def encode(diagram):
          return base64.urlsafe_b64encode(zlib.compress(diagram.encode(), 9)).decode()

      # Tracked *.md only, anchored at the repo root: skips vendored trees and the
      # gitignored worktrees under .claude/. Files without a block are left alone.
      root = subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()
      out = subprocess.check_output(['git', '-C', root, 'ls-files', '-z', '*.md'])
      files = [f for f in out.decode().split('\x00') if f]

      # 1=open  2=body (up to the closing ``` line)  3=close (```...-->)
      # 4=image prefix  5=closing paren
      pattern = (r'(<!--\s*```SVGBob\n)'
                 r'((?:(?!\n```).)*?)'
                 r'(\n```[^>]*?-->)'
                 r'(\s*!\[[^\]]*\]\(https://kroki\.io/svgbob/svg/)[A-Za-z0-9_=-]*(\))?')

      def replace_existing(m):
          body = m.group(2).replace('-->', DASH)
          return m.group(1) + body + m.group(3) + m.group(4) + encode(body) + (m.group(5) or ')')

      pattern_missing = r'(<!--\s*```SVGBob\n)((?:(?!\n```).)*?)(\n```[^>]*?-->)(?!\s*!\[)'

      def add_url(m):
          body = m.group(2).replace('-->', DASH)
          return m.group(1) + body + m.group(3) + f'\n![Diagram](https://kroki.io/svgbob/svg/{encode(body)})'

      for rel in files:
          path = f'{root}/{rel}'
          try:
              content = original = open(path, encoding='utf-8').read()
          except (UnicodeDecodeError, FileNotFoundError):
              continue
          content = re.sub(pattern, replace_existing, content, flags=re.DOTALL)
          content = re.sub(pattern_missing, add_url, content, flags=re.DOTALL)
          if content != original:
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f"Updated: {rel}")
      PYTHON
