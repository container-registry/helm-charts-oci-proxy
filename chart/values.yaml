replicaCount: 1
customLabels: {}

deploymentStrategy:
  type: RollingUpdate

image:
  repository: 8gears.container-registry.com/library/helm-charts-oci-proxy
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false
  className: "nginx"
  # No annotations are set by default. Add whatever your ingress controller
  # and certificate tooling need, for example:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   kubernetes.io/tls-acme: "true"
  annotations: {}
  hosts:
    - host: chartproxy.container-registry.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: chartproxy-acme-tls
      hosts:
        - chartproxy.container-registry.com

resources:
  #   limits:
  #     cpu: 200m
  #     memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# persistence
persistence:
  enabled: false
  existingClaim: ""
  size: 5Gi
  # storageClass: "-"
  accessMode: ReadWriteOnce
  annotations: {}
# custom app values

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

app:
  env_vars:
    DEBUG: false
    USE_TLS: false
    MANIFEST_CACHE_TTL: 60
    INDEX_CACHE_TTL: 14400
    INDEX_ERROR_CACHE_TTL: 30
    REWRITE_DEPENDENCIES: false
    # Required when REWRITE_DEPENDENCIES is true; a bare host[:port].
    PROXY_HOST: ""
    # Seconds the proxy lets in-flight requests finish after SIGTERM.
    SHUTDOWN_TIMEOUT: 25

# On termination the pod first sleeps preStopSleepSeconds, so endpoints and
# ingress controllers stop routing to it, then the proxy gets SIGTERM and drains
# for SHUTDOWN_TIMEOUT. terminationGracePeriodSeconds defaults to
# preStopSleepSeconds + SHUTDOWN_TIMEOUT + 5; an explicit value must cover both.
shutdown:
  # 0 disables the preStop hook.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: null

extraVolumes: []
extraVolumeMounts: []
